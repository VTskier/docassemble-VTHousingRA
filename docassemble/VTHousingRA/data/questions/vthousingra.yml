    Ask landlord for an accommodation due to disability
  short title: >-
    Ask landlord for an accommodation
  description: |-
    This interview helps a tenant write a letter to a landlord to request a reasonable accommodation related to a disability.
  can_I_use_this_form: |
    You can use this form if you or someone in your household has a disability and you need a reasonable accommodation from your landlord.
  before_you_start: |
    Before you start, gather the name and address of your landlord or property manager.
  when_you_are_finished: |
    After you finish, download and sign your letter. Then send it to your landlord by tenant portal, email, or mail. Keep a copy for your records.
  
  maturity: production
  estimated_completion_minutes: 10
  estimated_completion_delta: 4
